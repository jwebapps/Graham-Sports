<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Graham Bears Athletics</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root{
      --red:#e63d32;
      --red-dark:#c92e25;
      --red-soft:#fde9e7;
      --black:#050505;
      --ink:#151515;
      --muted:#6d6d6d;
      --line:#e7e7e7;
      --paper:#ffffff;
      --page:#f6f6f6;
      --shadow:0 8px 24px rgba(0,0,0,.09);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh}
    button,a,select,input{font:inherit}
    button{cursor:pointer}
    .app{max-width:560px;margin:0 auto;min-height:100vh;background:#fff;padding-bottom:calc(88px + env(safe-area-inset-bottom));box-shadow:0 0 36px rgba(0,0,0,.08)}

    /* Branded black header — "better" chevron treatment */
    .brand-header{
      position:relative;
      min-height:190px;
      padding:calc(16px + env(safe-area-inset-top)) 18px 34px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:visible;
      background:transparent;
      margin-bottom:28px;
      isolation:isolate;
    }
    .brand-header:before{
      content:"";
      position:absolute;
      left:0; right:0; top:0; bottom:-8px;
      background:var(--red);
      clip-path:polygon(0 0,100% 0,100% 80%,50% 100%,0 80%);
      z-index:-2;
      pointer-events:none;
    }
    .brand-header:after{
      content:"";
      position:absolute;
      inset:0;
      background:#000;
      clip-path:polygon(0 0,100% 0,100% 80%,50% 100%,0 80%);
      z-index:-1;
      pointer-events:none;
    }
    .brand-logo{
      width:min(330px,72vw);
      max-height:132px;
      object-fit:contain;
      display:block;
      position:relative;
      z-index:2;
      transform:translateY(2px);
    }
    .header-menu{
      position:absolute;
      left:18px;
      top:calc(27px + env(safe-area-inset-top));
      z-index:3;
      border:0;
      background:transparent;
      color:white;
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      font-size:30px;
      line-height:1;
    }
    .team-link{
      position:absolute;
      right:16px;
      top:calc(28px + env(safe-area-inset-top));
      z-index:3;
      border:1px solid #3b3b3b;
      background:#0e0e0e;
      color:#fff;
      border-radius:999px;
      padding:9px 11px;
      font-size:11px;
      font-weight:900;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    .content{padding:18px 18px 28px;background:#fff;position:relative;z-index:1}
    .section-kicker{display:flex;align-items:center;gap:9px;color:var(--red);font-size:17px;font-weight:950;text-transform:uppercase;letter-spacing:.03em;margin:3px 0 14px}
    .section-kicker .icon{font-size:20px}
    .section{margin-top:22px}
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:11px}
    .section-title{margin:0;font-size:18px;color:var(--red);font-weight:950;text-transform:uppercase;letter-spacing:.02em}
    .linkish{border:0;background:transparent;color:#303030;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:4px 0}

    /* Next-game feature card */
    .hero{position:relative;overflow:hidden;background:#000;color:#fff;border-radius:16px;padding:20px 18px 18px;box-shadow:var(--shadow);min-height:322px}
    .hero:after{content:"";position:absolute;right:-64px;top:22px;width:270px;height:270px;background:url('assets/graham-bears-logo.png') center/contain no-repeat;opacity:.075;filter:grayscale(1);pointer-events:none}
    .sport-ribbon{display:inline-block;position:relative;z-index:1;background:var(--red);padding:8px 12px;border-radius:6px;font-size:12px;font-weight:950;text-transform:uppercase;letter-spacing:.025em;margin-bottom:17px}
    .sport-ribbon:after{content:"";position:absolute;left:0;bottom:-8px;border-top:8px solid var(--red-dark);border-right:8px solid transparent}
    .hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:12px}
    .school-name{font-size:25px;font-weight:950;text-transform:uppercase;letter-spacing:.02em;line-height:1.03;margin-bottom:9px}
    .matchup{font-size:27px;font-weight:950;text-transform:uppercase;line-height:1.02;margin-bottom:18px}.matchup .vs{color:var(--red);font-size:19px;margin-right:4px}
    .game-meta{display:grid;gap:10px;font-size:14px}.meta-row{display:grid;grid-template-columns:22px 1fr;align-items:start;gap:7px}.meta-ico{color:var(--red);font-size:18px;line-height:1}
    .record{text-align:center;align-self:center}.record-label{font-size:10px;text-transform:uppercase;font-weight:900;color:#ddd}.record-value{color:var(--red);font-size:55px;line-height:1;font-weight:950;letter-spacing:-.05em;margin:7px 0}.record-sub{font-size:10px;color:#ddd;font-weight:800;text-transform:uppercase}
    .hero-actions{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
    .btn{border-radius:10px;padding:13px 10px;border:1px solid #555;font-weight:900;text-transform:uppercase;font-size:12px;letter-spacing:.02em;text-decoration:none;text-align:center}
    .btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.secondary{background:#000;color:#fff}

    /* Schedule rows */
    .game-list{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.04)}
    .game{display:grid;grid-template-columns:56px 26px 1fr auto;gap:10px;align-items:center;padding:14px 12px;border-bottom:1px solid var(--line);min-height:78px}.game:last-child{border-bottom:0}
    .datebox{text-align:center}.datebox .mon{font-size:10px;font-weight:900;text-transform:uppercase}.datebox .day{font-size:25px;color:var(--red);font-weight:950;line-height:1.02}.datebox .dow{font-size:9px;color:var(--muted);margin-top:3px}
    .homeaway-icon{font-size:18px;text-align:center;font-weight:900;color:#222}.homeaway-icon.home{color:var(--red)}
    .opponent{font-size:16px;font-weight:900;line-height:1.1}.small{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.3}
    .badge{display:inline-block;border-radius:7px;padding:6px 8px;background:var(--red-soft);color:var(--red);font-size:10px;font-weight:950;text-transform:uppercase;min-width:48px;text-align:center}.badge.final.win{background:#e9f5ec;color:#24723f}.badge.final.loss{background:#fce8e7;color:#a52b23}.score{font-size:13px;font-weight:950;text-align:center;margin-bottom:3px}
    .empty{border:1px solid var(--line);border-radius:14px;padding:18px;color:var(--muted);font-size:13px;background:#fff}

    /* Standings */
    .stand-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.04)}
    .stand-row{display:grid;grid-template-columns:28px 1fr 32px 32px 46px;gap:8px;align-items:center;padding:12px 12px;border-bottom:1px solid var(--line);font-size:13px}.stand-row:last-child{border-bottom:0}
    .stand-row.head{background:#000;color:#fff;font-size:10px;font-weight:900;text-transform:uppercase}.stand-row.ours{background:linear-gradient(90deg,#fff0ef,#fde3e1);color:var(--red)}
    .teamname{font-weight:900}.stand-row.ours .teamname{color:var(--red)}

    /* Schedule screen */
    .sub-header{margin:-18px -18px 0;background:#000;color:#fff;padding:15px 18px 0;display:flex;align-items:center;justify-content:center;min-height:62px;position:relative}
    .sub-logo{position:absolute;left:15px;top:13px;width:106px;height:43px;object-fit:contain}.sub-title{font-weight:950;font-size:20px;text-transform:uppercase;letter-spacing:.025em}
    .filter-tabs{display:grid;grid-template-columns:repeat(3,1fr);margin:0 -18px 15px;background:#fff;border-bottom:1px solid var(--line)}
    .filter-tab{border:0;background:#fff;padding:13px 4px;font-weight:800;font-size:12px}.filter-tab.active{background:var(--red);color:#fff}
    .month-title{font-size:12px;font-weight:900;text-transform:uppercase;color:#4f4f4f;margin:18px 2px 8px}

    /* Teams/settings */
    .card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
    .settings label{display:block;font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase;margin:14px 0 6px}.settings select,.settings input{width:100%;border:1px solid #d8d8d8;border-radius:10px;padding:12px;background:#fff;color:#111}.settings .wide-btn{width:100%;margin-top:10px}
    .footer-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:15px}

    /* Status */
    .sync-note{font-size:10px;color:#8a8a8a;margin-top:12px;text-align:center}.sync-note a{color:inherit;font-weight:800}
    .error-note{background:#fff0ef;color:#8c2d27;border:1px solid #f7d1cd;border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:13px}
    .loader{width:22px;height:22px;border:3px solid #eee;border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;margin:24px auto}@keyframes spin{to{transform:rotate(360deg)}}

    .screen{display:none}.screen.active{display:block}
    .bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);z-index:10;background:#050505;border-top:1px solid #222;padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr)}
    .navbtn{position:relative;border:0;background:transparent;color:#aaa;padding:7px 3px 5px;font-size:9px;font-weight:800;text-transform:uppercase}.navbtn .ico{font-size:21px;display:block;line-height:1.1;margin-bottom:4px}.navbtn.active{color:var(--red)}.navbtn.active:before{content:"";position:absolute;left:12px;right:12px;top:-7px;height:3px;background:var(--red);border-radius:0 0 3px 3px}

    @media (min-width:620px){body{padding:24px 0;background:#ededed}.app{border-radius:26px;overflow:hidden;min-height:calc(100vh - 48px)}.bottom{bottom:24px;border-radius:0 0 26px 26px}}
  
    @media (max-width:420px){
      .brand-header{min-height:172px;margin-bottom:24px;padding-bottom:30px}
      .brand-logo{width:min(300px,70vw);max-height:120px}
      .content{padding-top:14px}
    }

  
    .practice-card{border:1px solid var(--line);border-radius:15px;padding:15px 16px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.04)}
    .practice-main{font-size:18px;font-weight:950;margin-bottom:6px}.practice-main .time{color:var(--red)}
    .practice-detail{font-size:13px;color:var(--muted);line-height:1.5}.practice-next{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;font-weight:850}.practice-next strong{color:var(--red)}
    .calendar-team-btn{width:100%;margin:12px 0 4px;border:0;border-radius:12px;padding:13px 14px;background:var(--red);color:#fff;font-weight:950;text-transform:uppercase;letter-spacing:.02em;font-size:12px;box-shadow:0 4px 12px rgba(230,61,50,.18)}
    .calendar-team-btn:active{transform:translateY(1px)}
  
    .calendar-menu-backdrop{
      position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;
      align-items:flex-end;justify-content:center;z-index:9999;padding:16px;
    }
    .calendar-menu-backdrop.open{display:flex}
    .calendar-menu{
      width:min(520px,100%);background:#fff;border-radius:20px;padding:18px;
      box-shadow:0 20px 60px rgba(0,0,0,.28);
    }
    .calendar-menu h3{margin:0 0 6px;font-size:18px}
    .calendar-menu p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.4}
    .calendar-choice{
      display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;
      margin:9px 0;text-align:center;font-weight:900;text-decoration:none;
      font-size:14px;
    }
    .calendar-choice.apple{background:#000;color:#fff}
    .calendar-choice.google{background:var(--red);color:#fff}
    .calendar-close{
      width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
      border-radius:14px;padding:12px 14px;font-weight:800;margin-top:4px;
    }

  
    .google-calendar-help{display:none;margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fafafa}
    .google-calendar-help.open{display:block}
    .google-calendar-help ol{margin:8px 0 12px;padding-left:20px;color:var(--ink);font-size:13px;line-height:1.45}
    .calendar-copy-status{min-height:18px;margin-top:8px;color:var(--muted);font-size:12px;text-align:center}
  
    .view-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
    .view-switch button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:10px 12px;font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
    .view-switch button.active{background:#000;color:#fff;border-color:#000}
    .fans-hero{background:#000;color:#fff;border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
    .fans-hero .eyebrow{color:var(--red);font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.08em}
    .fans-hero h2{margin:7px 0 4px;font-size:28px;line-height:1}
    .fans-hero p{margin:0;color:#d8d8d8;font-size:13px}
    .fan-cards{display:grid;gap:10px}
    .fan-game-card{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center}
    .fan-game-card .team-code{font-size:11px;font-weight:950;color:var(--red);text-transform:uppercase}
    .fan-game-card .match{font-size:15px;font-weight:900;line-height:1.15}
    .fan-game-card .when{font-size:11px;color:var(--muted);margin-top:4px}
    .fan-game-card .score-big{font-size:18px;font-weight:950}
    .fan-game-card .result-pill{display:inline-block;margin-top:4px;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:950;text-transform:uppercase}
    .result-pill.win{background:#e9f5ec;color:#24723f}
    .result-pill.loss{background:#fce8e7;color:#a52b23}
    .result-pill.tie{background:#f0f0f0;color:#555}
    .record-grid{display:grid;gap:8px}
    .record-row{display:grid;grid-template-columns:1fr 54px 54px;gap:8px;align-items:center;padding:12px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
    .record-row .name{font-weight:900;font-size:14px}
    .record-row .sub{font-size:10px;color:var(--muted);margin-top:3px}
    .record-row .record{font-weight:950;text-align:center;color:var(--red)}
    .record-row .place{font-size:12px;text-align:right;color:var(--muted);font-weight:850}
    .fan-team-link{border:0;background:transparent;padding:0;text-align:left;width:100%;color:inherit}
    .fans-all-calendar{width:100%;margin-top:10px;border:0;border-radius:12px;padding:13px;background:var(--red);color:#fff;font-weight:950;text-transform:uppercase;font-size:12px}

  </style>
</head>
<body>
<div class="app">
  <header class="brand-header">
    <button class="header-menu" aria-label="Choose team" onclick="go('teams')">☰</button>
    <img class="brand-logo" src="assets/graham-bears-logo.png" alt="Graham Bears Athletics" />
    <button class="team-link" id="teamQuick" onclick="go('teams')">Team</button>
  </header>

  <main class="content">
    <div class="view-switch" id="viewSwitch">
      <button id="myTeamViewBtn" onclick="setAppView('team')">My Team</button>
      <button id="fansViewBtn" onclick="setAppView('fans')">Graham Fans</button>
    </div>
    <section id="home" class="screen active"></section>
    <section id="fansHome" class="screen"></section>
    <section id="schedule" class="screen"></section>
    <section id="standings" class="screen"></section>
    <section id="teams" class="screen"></section>
  </main>
</div>

<nav class="bottom" aria-label="Primary navigation">
  <button class="navbtn active" data-screen="home"><span class="ico">⌂</span>Home</button>
  <button class="navbtn" data-screen="schedule"><span class="ico">▦</span>Schedule</button>
  <button class="navbtn" data-screen="standings"><span class="ico">♜</span>Standings</button>
  <button class="navbtn" data-screen="teams"><span class="ico">◉</span>Teams</button>
</nav>

<script src="static-schedules.js"></script>
<script>
const teamOptions = [
  ['bb8','8th Boys Basketball'],
  ['bb7','7th Boys Basketball'],
  ['bb6','6th Boys Basketball'],
  ['softball','Girls Softball'],
  ['xc','Cross Country']
];
const validTeamIds = new Set(teamOptions.map(([id]) => id));
const urlParams = new URLSearchParams(window.location.search);
const urlTeam = urlParams.get('team');
const urlView = urlParams.get('view');
const savedTeam = localStorage.getItem('team');
const initialTeam = validTeamIds.has(urlTeam) ? urlTeam : (validTeamIds.has(savedTeam) ? savedTeam : 'bb7');
const state = { selected:initialTeam, appView:(urlView==='fans'?'fans':'team'), payload:null, loading:false, error:null, scheduleFilter:'all', requestSeq:0, abort:null };
localStorage.setItem('team',initialTeam);
if(urlTeam!==initialTeam || (state.appView==='fans' && urlView!=='fans')){const url=new URL(location.href);url.searchParams.set('team',initialTeam);if(state.appView==='fans')url.searchParams.set('view','fans');history.replaceState(null,'',url)}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = iso => new Date(iso).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const fmtLong = iso => new Date(iso).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
const dparts = iso => {const d=new Date(iso);return {dow:d.toLocaleDateString(undefined,{weekday:'short'}),day:d.getDate(),mon:d.toLocaleDateString(undefined,{month:'short'})}};
const monthKey = iso => new Date(iso).toLocaleDateString(undefined,{month:'long',year:'numeric'});
function selectedLabel(){return teamOptions.find(x=>x[0]===state.selected)?.[1]||state.selected}
function record(games,standings=[]){const row=(standings||[]).find(x=>/Graham/i.test(x.team||''));if(row)return {w:Number(row.w)||0,l:Number(row.l)||0,t:Number(row.t)||0};let w=0,l=0,t=0;games.filter(g=>g.status==='final').forEach(g=>{const r=String(g.result||'').toUpperCase();if(r==='W')w++;else if(r==='L')l++;else if(r==='T')t++;else if(g.us!=null&&g.them!=null){if(g.us>g.them)w++;else if(g.us<g.them)l++;else t++}});return {w,l,t}}
function directions(g){
  const destination=(g.venueAddress||'').trim();
  if(destination) return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(destination)+'&travelmode=driving';
  return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(g.venue||'');
}
function pct(r){const n=r.w+r.l+r.t;return n?((r.w+.5*r.t)/n).toFixed(3).replace(/^0/,''):'.000'}
function shortTeam(){return selectedLabel().replace('Basketball','BB').replace('Volleyball','VB').replace('Cross Country','XC').replace('Track & Field','Track')}
function venueShort(v){return (v||'Venue TBD').replace('Middle School','MS').replace('Graham Middle School','Graham MS')}
function gameRow(g){
  const p=dparts(g.date),final=g.status==='final';
  const outcome=final?(String(g.result||'').toUpperCase()||(g.us>g.them?'W':g.us<g.them?'L':'T')):'';
  const hasNumericScore=final&&g.us!=null&&g.them!=null;
  const pastUnscored=!final && isPastGame(g);
  const badgeClass=final?`badge final ${outcome==='W'?'win':outcome==='L'?'loss':''}`:'badge';
  return `<div class="game">
    <div class="datebox"><div class="mon">${p.mon}</div><div class="day">${p.day}</div><div class="dow">${p.dow}</div></div>
    <div class="homeaway-icon ${g.home?'home':''}">${g.home?'⌂':'@'}</div>
    <div><div class="opponent">${esc(g.opp)}</div><div class="small">${fmtTime(g.date)} · ${esc(venueShort(g.venue))}</div></div>
    <div>${hasNumericScore?`<div class="score">${g.us}–${g.them}</div>`:''}<span class="${badgeClass}">${final?outcome:(pastUnscored?'Past':(g.home?'Home':'Away'))}</span></div>
  </div>`;
}
function standingsMarkup(rows){
  if(!rows?.length)return '<div class="empty">VAL is not currently publishing standings for this division.</div>';
  return `<div class="stand-card"><div class="stand-row head"><div>#</div><div>Team</div><div>W</div><div>L</div><div>PCT</div></div>${rows.map((x,i)=>`<div class="stand-row ${/Graham/i.test(x.team)?'ours':''}"><div>${esc(x.place||i+1)}</div><div class="teamname">${esc(x.team)}</div><div>${esc(x.w)}</div><div>${esc(x.l)}</div><div>${esc(x.pct||'--')}</div></div>`).join('')}</div>`;
}

function parseLocalDate(dateStr,timeStr){
  const [y,m,d]=dateStr.split('-').map(Number), [hh,mm]=timeStr.split(':').map(Number);
  return new Date(y,m-1,d,hh,mm,0,0);
}
function localDateKey(value){
  const d=value instanceof Date?value:new Date(value);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function practiceEvents(p){
  const rule=p?.practice;
  if(!rule?.start||!rule?.end)return [];
  const gameDays=new Set((p.games||[]).map(g=>localDateKey(g.date)));
  const start=parseLocalDate(rule.start,rule.startTime||'15:30');
  const end=parseLocalDate(rule.end,rule.startTime||'15:30');
  const events=[];
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const day=d.getDay();
    if(!(rule.days||[1,2,3,4]).includes(day))continue;
    const key=localDateKey(d);
    if(gameDays.has(key))continue;
    const startAt=parseLocalDate(key,rule.startTime||'15:30');
    const endAt=parseLocalDate(key,rule.endTime||'17:00');
    events.push({date:startAt.toISOString(),endDate:endAt.toISOString(),eventType:'practice',home:true,opp:'Practice',venue:rule.venue||'Graham Middle School',venueAddress:'1175 Castro Street, Mountain View, CA 94040'});
  }
  return events;
}
function nextPractice(p){
  const now=new Date();
  return practiceEvents(p).find(x=>new Date(x.date)>=now)||null;
}
function practiceMarkup(p){
  const rule=p.practice;
  if(!rule)return '<div class="empty">Practice information is not currently available for this sport.</div>';
  const next=nextPractice(p);
  return `<div class="practice-card"><div class="practice-main"><span class="time">${esc(rule.startTime==='15:30'?'3:30–5:00 PM':(rule.startTime||''))}</span> · Mon–Thu</div><div class="practice-detail">${esc(rule.note||'Practice on non-game days.')}<br>${esc(rule.venue||'Graham Middle School')}</div>${next?`<div class="practice-next">Next practice: <strong>${fmtLong(next.date)} · ${fmtTime(next.date)}</strong></div>`:''}</div>`;
}
function escapeICS(v){
  return String(v ?? '').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
}
function pad2(n){return String(n).padStart(2,'0')}
function icsLocal(iso){
  const d=new Date(iso);
  return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
}
function icsStamp(){
  const d=new Date();
  return `${d.getUTCFullYear()}${pad2(d.getUTCMonth()+1)}${pad2(d.getUTCDate())}T${pad2(d.getUTCHours())}${pad2(d.getUTCMinutes())}${pad2(d.getUTCSeconds())}Z`;
}



function gameStartMs(g){
  return new Date(g.date).getTime();
}
function gameEndMs(g){
  // Keep a game/meet as the current event for up to 3 hours after start.
  return gameStartMs(g) + 3*60*60*1000;
}
function isUpcomingGame(g){
  return g.status !== 'final' && gameEndMs(g) >= Date.now();
}
function isPastGame(g){
  return g.status === 'final' || gameEndMs(g) < Date.now();
}
function sortedGames(games){
  return [...games].sort((a,b)=>gameStartMs(a)-gameStartMs(b));
}

function teamCalendarHttpsUrl(){

}
function appleCalendarUrl(){

}
function openCalendarMenu(){
  const title=document.getElementById("calendarMenuTitle");
  const apple=document.getElementById("appleCalendarLink");
  const help=document.getElementById("googleCalendarHelp");
  const status=document.getElementById("calendarCopyStatus");
  const fallback=document.getElementById("calendarUrlFallback");
  if(title) title.textContent=`Add ${selectedLabel()} Calendar`;
  if(apple) apple.href=appleCalendarUrl();
  if(help) help.classList.remove("open");

  document.getElementById("calendarMenuBackdrop")?.classList.add("open");
}
function closeCalendarMenu(){
  document.getElementById("calendarMenuBackdrop")?.classList.remove("open");
}
function showGoogleCalendarHelp(){

}
async function copyGoogleCalendarUrl(){
  const url=teamCalendarHttpsUrl();
  const status=document.getElementById("calendarCopyStatus");
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(url);
    }else{
      const ta=document.createElement("textarea");
      ta.value=url; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    if(status) status.textContent="Calendar URL copied.";
  }catch(e){
    if(status) status.textContent="Copy failed. Press and hold the URL below to copy it.";
    const fallback=document.getElementById("calendarUrlFallback");
    if(fallback){fallback.textContent=url;fallback.style.display="block";}
  }
}


function teamCode(id){
  return ({bb8:'BB8',bb7:'BB7',bb6:'BB6',softball:'SB',xc:'XC'})[id] || id.toUpperCase();
}
function setAppView(view){
  state.appView = view==='fans' ? 'fans' : 'team';
  const url=new URL(location.href);
  if(state.appView==='fans') url.searchParams.set('view','fans'); else url.searchParams.delete('view');
  history.replaceState(null,'',url);
  renderViewMode();
}
function renderViewMode(){
  const isFans=state.appView==='fans';
  document.getElementById('myTeamViewBtn')?.classList.toggle('active',!isFans);
  document.getElementById('fansViewBtn')?.classList.toggle('active',isFans);

  document.getElementById('standings')?.classList.remove('active');

function staticTeamPayload(id){
  const t=window.GRAHAM_SCHEDULES?.[id];
  if(!t) return null;
  return {
    id, label:t.label, team:'Graham Bears',
    games:(t.games||[]).map(g=>({...g})),
    standings:[], resultsSyncedAt:null, practice:t.practice||null
  };
}
async function fetchTeamResultsForFans(id){
  const payload=staticTeamPayload(id);
  if(!payload) return null;
  try{
    const r=await fetch(`results/${encodeURIComponent(id)}.json?ts=${Date.now()}`,{cache:'no-store'});
    if(r.ok){
      const body=await r.json();
      const results=body.results||[];
      const byKey=new Map(results.map(g=>[gameKey(g),g]));
      const byOpponent=new Map();
      for(const rr of results){
        const opp=String(rr.opp||'').toLowerCase().replace(/\s+/g,' ').trim();
        if(!opp) continue;
        if(!byOpponent.has(opp)) byOpponent.set(opp,[]);
        byOpponent.get(opp).push(rr);
      }
      payload.games=payload.games.map(g=>{
        let rr=byKey.get(gameKey(g));
        if(!rr){
          const opp=String(g.opp||'').toLowerCase().replace(/\s+/g,' ').trim();
          const matches=byOpponent.get(opp)||[];
          if(matches.length===1) rr=matches[0];
        }
        return rr ? {...g,date:rr.date||g.date,us:rr.us,them:rr.them,status:rr.status||((rr.us!=null&&rr.them!=null)?'final':'scheduled')} : g;
      });
      payload.standings=body.standings||[];
      payload.resultsSyncedAt=body.fetchedAt||null;
    }
  }catch(e){}
  return payload;
}
function fanResultOutcome(g){
  if(g.status!=='final') return '';
  if(g.us==null || g.them==null) return g.result||'';
  if(g.us>g.them) return 'W';
  if(g.us<g.them) return 'L';
  return 'T';
}
function fanGameCard(teamId,p,g,mode){
  const code=teamCode(teamId);
  const d=new Date(g.date);
  const date=d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const time=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  if(mode==='result'){
    const outcome=fanResultOutcome(g);
    const cls=outcome==='W'?'win':outcome==='L'?'loss':'tie';
    const score=(g.us!=null&&g.them!=null)?`${g.us}–${g.them}`:(outcome||'Final');
    return `<button class="fan-team-link" onclick="openTeamFromFans('${teamId}')"><div class="fan-game-card">
      <div><div class="team-code">${code}</div><div class="when">${date}</div></div>
      <div><div class="match">${esc(g.opp)}</div><div class="when">${g.home?'Home':'Away'} · ${esc(venueShort(g.venue))}</div></div>
      <div style="text-align:right"><div class="score-big">${score}</div><span class="result-pill ${cls}">${outcome||'Final'}</span></div>
    </div></button>`;
  }
  return `<button class="fan-team-link" onclick="openTeamFromFans('${teamId}')"><div class="fan-game-card">
    <div><div class="team-code">${code}</div><div class="when">${date}</div></div>
    <div><div class="match">${g.home?'vs':'@'} ${esc(g.opp)}</div><div class="when">${time} · ${esc(venueShort(g.venue))}</div></div>
    <div><span class="badge">${g.home?'Home':'Away'}</span></div>
  </div></button>`;
}
function currentTeamPlace(p){
  const row=(p.standings||[]).find(x=>/Graham/i.test(x.team||''));
  return row ? `${row.place}${String(row.place).match(/^\d+$/)?ordinalSuffix(Number(row.place)):''}` : '—';
}
function ordinalSuffix(n){
  const v=n%100;
  return (v>=11&&v<=13)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th');
}
function openTeamFromFans(id){
  state.selected=id;
  localStorage.setItem('team',id);
  state.appView='team';
  const url=new URL(location.href);
  url.searchParams.set('team',id);
  url.searchParams.delete('view');
  history.replaceState(null,'',url);
  renderViewMode();
  loadTeam(id,true);
}
async function renderFansHome(){
  const el=document.getElementById('fansHome');
  if(!el) return;
  el.innerHTML=`<div class="fans-hero"><div class="eyebrow">Graham Bears</div><h2>Fans</h2><p>Scores, standings and what’s next across Graham athletics.</p></div><div class="empty">Loading Graham sports…</div>`;
  const ids=['bb8','bb7','bb6','softball','xc'];
  const payloads=(await Promise.all(ids.map(fetchTeamResultsForFans))).filter(Boolean);
  const now=Date.now();

  const upcoming=[];
  const results=[];
  for(const p of payloads){
    for(const g of p.games||[]){
      const start=new Date(g.date).getTime();
      if(g.status==='final' || start+3*60*60*1000<now){
        if(g.status==='final') results.push({teamId:p.id,p,g});
      }else{
        upcoming.push({teamId:p.id,p,g});
      }
    }
  }
  upcoming.sort((a,b)=>new Date(a.g.date)-new Date(b.g.date));
  results.sort((a,b)=>new Date(b.g.date)-new Date(a.g.date));

  const recordRows=payloads.map(p=>{
    const r=record(p.games||[]);
    const hasGames=(p.games||[]).some(g=>g.status==='final');
    const recordText=hasGames?`${r.w}-${r.l}${r.t?`-${r.t}`:''}`:'—';
    const row=(p.standings||[]).find(x=>/Graham/i.test(x.team||''));
    const place=row?.place?`${row.place}${ordinalSuffix(Number(row.place))}`:'—';
    return `<button class="fan-team-link" onclick="openTeamFromFans('${p.id}')"><div class="record-row">
      <div><div class="name">${esc(p.label)}</div><div class="sub">${teamCode(p.id)}</div></div>
      <div class="record">${recordText}</div>
      <div class="place">${place}</div>
    </div></button>`;
  }).join('');

  el.innerHTML=`
    <div class="fans-hero"><div class="eyebrow">Graham Bears</div><h2>Fans</h2><p>Scores, standings and what’s next across Graham athletics.</p></div>

    <div class="section"><div class="section-head"><h3 class="section-title">Coming Up</h3></div>
      <div class="fan-cards">${upcoming.length?upcoming.slice(0,8).map(x=>fanGameCard(x.teamId,x.p,x.g,'upcoming')).join(''):'<div class="empty">No upcoming games are currently listed.</div>'}</div>
    </div>

    <div class="section"><div class="section-head"><h3 class="section-title">Latest Results</h3></div>
      <div class="fan-cards">${results.length?results.slice(0,8).map(x=>fanGameCard(x.teamId,x.p,x.g,'result')).join(''):'<div class="empty">No results have been posted yet.</div>'}</div>
    </div>

    <div class="section"><div class="section-head"><h3 class="section-title">Bears at a Glance</h3></div>
      <div class="record-grid">${recordRows}</div>
    </div>`;
}

function render(){
  $('#teamQuick').textContent=shortTeam();
  if(!state.payload){state.payload=staticPayload(state.selected)}
  renderHome();renderSchedule();renderStandings();renderTeams();
}
function staticPayload(id){
  const src=window.GRAHAM_SCHEDULES?.[id] || {id,label:selectedLabel(),games:[]};
  return {
    id, label:src.label||selectedLabel(), team:'Graham Bears', sourceUrl:src.sourceUrl||'', detailsUrl:src.detailsUrl||'', practice:src.practice?{...src.practice}:null,
    games:(src.games||[]).map(g=>({...g})), standings:[], resultsSyncedAt:null
  };
}
function gameKey(g){
  const d=new Date(g.date); const day=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return `${day}|${String(g.opp||'').toLowerCase().replace(/\s+/g,' ').trim()}`;
}
function mergeResults(body){
  if(!state.payload || body.id!==state.selected) return;
  const results=body.results||[];
  const byKey=new Map(results.map(g=>[gameKey(g),g]));
  const byOpponent=new Map();
  for(const r of results){
    const opp=String(r.opp||'').toLowerCase().replace(/\s+/g,' ').trim();
    if(!opp) continue;
    if(!byOpponent.has(opp)) byOpponent.set(opp,[]);
    byOpponent.get(opp).push(r);
  }
  state.payload.games=state.payload.games.map(g=>{
    let r=byKey.get(gameKey(g));
    if(!r){
      const opp=String(g.opp||'').toLowerCase().replace(/\s+/g,' ').trim();
      const matches=byOpponent.get(opp)||[];
      if(matches.length===1) r=matches[0];
    }
    return r ? {...g,date:r.date||g.date,us:r.us,them:r.them,result:r.result||g.result||null,status:r.status||((r.us!=null&&r.them!=null)||r.result?'final':'scheduled')} : g;
  });
  state.payload.standings=body.standings||[];
  state.payload.resultsSyncedAt=body.fetchedAt||new Date().toISOString();
}
function loadTeam(){
  if(state.abort) state.abort.abort();
  state.payload=staticPayload(state.selected);
  state.loading=false; state.error=null;
  render();
renderViewMode();
  syncResults(false);
}
async function syncResults(force=false){
  const requestedTeam=state.selected;
  const seq=++state.requestSeq;
  if(state.abort) state.abort.abort();
  state.abort=new AbortController();
  const cacheKey='gh-results:v3:'+requestedTeam;
  if(!force){
    try{
      const cached=JSON.parse(localStorage.getItem(cacheKey));
      if(cached&&cached.body?.id===requestedTeam&&Date.now()-cached.savedAt<30*60*1000){mergeResults(cached.body);render();return;}
    }catch(e){}
  }
  try{
    const res=await fetch(`results/${encodeURIComponent(requestedTeam)}.json${force?'?t='+Date.now():''}`,{cache:'no-store',signal:state.abort.signal});
    const body=await res.json();
    if(!res.ok) throw new Error(body.error||`HTTP ${res.status}`);
    if(body.id!==requestedTeam) throw new Error(`Results mismatch: requested ${requestedTeam}, received ${body.id||'unknown'}`);
    if(seq!==state.requestSeq||requestedTeam!==state.selected) return;
    mergeResults(body);
    localStorage.setItem(cacheKey,JSON.stringify({savedAt:Date.now(),body}));
    state.error=null;
  }catch(e){
    if(e.name==='AbortError')return;
    if(seq!==state.requestSeq||requestedTeam!==state.selected)return;
    state.error=e.message;
  }
  render();
}
function selectTeam(id){if(!validTeamIds.has(id))return;state.selected=id;localStorage.setItem('team',id);const url=new URL(location.href);url.searchParams.set('team',id);history.replaceState(null,'',url);loadTeam()}
function setFilter(id){state.scheduleFilter=id;renderSchedule()}
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.screen===id));window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>go(b.dataset.screen)));
async function copyTeamLink(){const url=new URL(location.href);url.searchParams.set('team',state.selected);try{await navigator.clipboard.writeText(url.href);alert('Team link copied.')}catch(e){prompt('Copy this team link:',url.href)}}
async function shareGame(){const g=sortedGames((state.payload?.games||[]).filter(isUpcomingGame))[0];if(!g)return;const text=`${state.payload.label}: ${fmtLong(g.date)} at ${fmtTime(g.date)} — ${g.home?'vs':'at'} ${g.opp}, ${g.venue}`;if(navigator.share){try{await navigator.share({title:'Graham Bears Game',text,url:location.href})}catch(e){}}else{try{await navigator.clipboard.writeText(text);alert('Game details copied.')}catch(e){}}}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
loadTeam();
</script>

<div class="calendar-menu-backdrop" id="calendarMenuBackdrop" onclick="if(event.target===this)closeCalendarMenu()">
  <div class="calendar-menu" role="dialog" aria-modal="true" aria-labelledby="calendarMenuTitle">
    <h3 id="calendarMenuTitle">Add Team Calendar</h3>
    <p>Subscribe to this team’s games and practices.</p>
    <a id="appleCalendarLink" class="calendar-choice apple" href="#">Apple Calendar</a>
    <button class="calendar-choice google" type="button" onclick="showGoogleCalendarHelp()">Google Calendar</button>
    <div class="google-calendar-help" id="googleCalendarHelp">
      <strong>Google Calendar subscription</strong>
      <ol>
        <li>On a computer, open Google Calendar.</li>
        <li>Next to <strong>Other calendars</strong>, click <strong>+</strong>.</li>
        <li>Choose <strong>From URL</strong>.</li>
        <li>Paste the calendar URL and click <strong>Add calendar</strong>.</li>

      <button class="calendar-choice google" type="button" onclick="copyGoogleCalendarUrl()">Copy Calendar URL</button>

    </div>
    <button class="calendar-close" onclick="closeCalendarMenu()">Cancel</button>
  </div>
</div>
